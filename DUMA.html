<div class="s vote" id="s6">
  <div class="vt">КОЛИЧЕСТВЕННОЕ ГОЛОСОВАНИЕ<br>В ПРОЦЕССЕ</div>
  <div class="vc" id="clk"></div>
  <div class="bar" id="bar6"></div>
</div>

<div class="s vote" id="s7"></div>

<div class="s vsum" id="s8">
  <div class="sub">Количественное голосование</div>
  <div class="sub">Государственная Дума</div>
  <div class="sub" id="t8"></div>
  <div class="rows" id="r8"></div>
  <div class="res" id="res8"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const clock = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
const pct = (v, t) => (t ? (v / t * 100) : 0).toFixed(1) + '%';
const TIMER_MS = 30000;


let step = 0, timer = null, clockInt = null;
let buf = '', vals = [];
const reg = {}, vot = {};

function show(n) {
  step = n;
  document.querySelectorAll('.s').forEach(e => e.classList.remove('on'));
  $('s' + n).classList.add('on');
  buf = ''; vals = [];
  clearInterval(clockInt);
  if (n === 2) startTimer('bar2', 3);
  if (n === 6) {
    $('clk').textContent = clock();
    clockInt = setInterval(() => $('clk').textContent = clock(), 250);
    startTimer('bar6', 7);
  }
  if (n === 4) renderReg();
  if (n === 8) renderVote();
}

function startTimer(barId, next) {
  const b = $(barId);
  b.style.transition = 'none'; b.style.width = '100%';
  b.offsetWidth;
  b.style.transition = 'width ' + TIMER_MS + 'ms linear'; b.style.width = '0';
  clearTimeout(timer);
  timer = setTimeout(() => show(next), TIMER_MS);
}

function row(label, v, p, cls) {
  return '<div class="row ' + (cls || '') + '"><span class="l">' + label + '&nbsp;<span class="d">' +
    '.'.repeat(80) + '</span></span><span class="n">' + v + ' ч.</span><span class="p">' + (p || '') + '</span></div>';
}

function renderReg() {
  const [t, p, a, q] = reg.v;
  $('t4').textContent = clock();
  $('r4').innerHTML = row('Всего депутатов', t, pct(t, t)) + row('Присутствует', p, pct(p, t)) +
    row('Отсутствует', a, pct(a, t)) + row('Кворум', q, '');
  $('s4').classList.toggle('bad', p < q);
  $('res4').textContent = p >= q ? 'К В О Р У М  Е С Т Ь' : 'К В О Р У М А  Н Е Т';
}

function renderVote() {
  const [z, pr, v, g] = vot.v;
  const t = reg.v ? reg.v[0] : 450;
  $('t8').textContent = clock();
  $('r8').innerHTML = row('За', z, pct(z, t)) + row('Против', pr, pct(pr, t)) +
    row('Воздержалось', v, pct(v, t)) + row('Голосовало', g, pct(g, t));
  const need = Math.floor(t / 2) + 1;
  $('s8').classList.toggle('bad', z < need);
  $('res8').textContent = z >= need ? 'РЕШЕНИЕ ПРИНЯТО' : 'РЕШЕНИЕ НЕ ПРИНЯТО';
}

document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.();
    return;
  }
  const inputScreen = step === 3 || step === 7;
  if (inputScreen) {
    e.preventDefault();
    if (/^\d$/.test(e.key)) { if (buf.length < 4) buf += e.key; }
    else if (e.key === 'Backspace') buf = buf.slice(0, -1);
    else if (e.key === 'Enter' && buf !== '') {
      vals.push(parseInt(buf, 10)); buf = '';
      if (vals.length === 4) {
        if (step === 3) { reg.v = vals; show(4); } else { vot.v = vals; show(8); }
      }
    }
    return;
  }
  if (e.key !== 'Enter') return;
  e.preventDefault();
  if (step === 2 || step === 6) { clearTimeout(timer); show(step + 1); return; }  // пропуск таймера
  if (step === 8) { show(0); return; }       // по кругу
  show(step === 0 ? 2 : step + 1);   // после логотипа сразу регистрация
});
</script>
